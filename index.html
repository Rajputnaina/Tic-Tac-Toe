<!DOCTYPE html>
<html>
<head>
    <title>Tic Tac Toe</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #fff;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .container {
            text-align: center;
            background: #fff;
            padding: 30px;
            border: 2px solid #000;
        }

        h1 {
            color: #000;
            margin-bottom: 20px;
        }

        #turn {
            margin-bottom: 20px;
            color: #000;
        }

        .game {
            display: grid;
            grid-template-columns: repeat(3, 90px);
            gap: 8px;
        }

        .cell {
            width: 90px;
            height: 90px;
            font-size: 35px;
            font-weight: bold;
            color: #000;
            background: #fff;
            border: 2px solid #000;
            cursor: pointer;
        }

        .cell:hover {
            color: #fff;
            background: #000;
        }

        #result {
            margin: 20px 0;
            color: #000;
        }

        #restart {
            padding: 12px 25px;
            background: #000;
            color: #fff;
            border: 2px solid #000;
            cursor: pointer;
            font-size: 16px;
        }

        #restart:hover {
            background: #fff;
            color: #000;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>Tic Tac Toe</h1>

        <h2 id="turn">X's Turn</h2>

        <div class="game">
            <button class="cell"></button>
            <button class="cell"></button>
            <button class="cell"></button>
            <button class="cell"></button>
            <button class="cell"></button>
            <button class="cell"></button>
            <button class="cell"></button>
            <button class="cell"></button>
            <button class="cell"></button>
        </div>

        <h2 id="result"></h2>

        <button id="restart">Restart Game</button>

    </div>

    <!-- Confetti Library -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>

    <script>

        let cells = document.querySelectorAll(".cell");

        let turn = document.getElementById("turn");
        let result = document.getElementById("result");
        let restart = document.getElementById("restart");

        let currentPlayer = "X";
        let gameOver = false;

        let winPatterns = [
            [0, 1, 2],
            [3, 4, 5],
            [6, 7, 8],
            [0, 3, 6],
            [1, 4, 7],
            [2, 5, 8],
            [0, 4, 8],
            [2, 4, 6]
        ];

        cells.forEach(function(cell) {

            cell.addEventListener("click", function() {

                if (cell.innerText !== "" || gameOver) {
                    return;
                }

                cell.innerText = currentPlayer;

                checkWinner();

                if (gameOver) {
                    return;
                }

                let filledCells = 0;

                cells.forEach(function(cell) {
                    if (cell.innerText !== "") {
                        filledCells++;
                    }
                });

                if (filledCells === 9) {
                    result.innerText = "It's a Draw! Nobody Won.";
                    turn.innerText = "Game Over";
                    gameOver = true;
                    return;
                }

                if (currentPlayer === "X") {
                    currentPlayer = "O";
                }
                else {
                    currentPlayer = "X";
                }

                turn.innerText = currentPlayer + "'s Turn";

            });

        });


        function checkWinner() {

            for (let pattern of winPatterns) {

                let a = pattern[0];
                let b = pattern[1];
                let c = pattern[2];

                if (
                    cells[a].innerText === currentPlayer &&
                    cells[b].innerText === currentPlayer &&
                    cells[c].innerText === currentPlayer
                ) {

                    result.innerText = currentPlayer + " Won the Game!";
                    turn.innerText = "Congratulations!";

                    gameOver = true;

                    confetti({
                        particleCount: 150,
                        spread: 100,
                        origin: { y: 0.6 }
                    });

                    return;
                }
            }
        }


        restart.addEventListener("click", function() {

            cells.forEach(function(cell) {
                cell.innerText = "";
            });

            currentPlayer = "X";
            gameOver = false;

            turn.innerText = "X's Turn";
            result.innerText = "";

        });

    </script>

</body>
</html>
